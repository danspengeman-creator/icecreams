<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lillian's Ice Cream Tracker</title>
<style>
  :root {
    --pink: #ff6fa5;
    --pink-deep: #e85490;
    --mint: #7fd9c4;
    --cream: #fff8ef;
    --choc: #5a3825;
    --vanilla: #fff1d6;
    --shadow: 0 6px 16px rgba(90, 56, 37, 0.15);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  @keyframes floatSparkle {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-6px) rotate(3deg); }
  }
  @keyframes popIn {
    0% { transform: scale(0.7); opacity: 0; }
    60% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); }
  }
  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-8deg); }
    75% { transform: rotate(8deg); }
  }
  @keyframes coneLand {
    0% { transform: scale(0) rotate(-20deg); opacity: 0; }
    70% { transform: scale(1.3) rotate(8deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); }
  }
  #sparkleField {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .sparkle {
    position: absolute;
    bottom: -40px;
    font-size: 1.2rem;
    animation: floatSparkle linear infinite;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(-45deg, #ffb3c1, #ffd6a5, #fdffb6, #caffbf, #9bf6ff, #a0c4ff, #bdb2ff, #ffc6ff);
    background-size: 500% 500%;
    animation: shimmer 18s ease infinite;
    color: var(--choc);
    position: relative;
    overflow-x: hidden;
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 60px;
    min-height: 100%;
  }
  header {
    text-align: center;
    padding: 10px 0 18px;
  }
  header h1 {
    font-size: 1.7rem;
    margin: 0;
    letter-spacing: -0.5px;
  }
  header .sub {
    font-size: 0.9rem;
    color: #8a6a55;
    margin-top: 4px;
  }
  .cone-emoji {
    font-size: 1.5rem;
    vertical-align: -3px;
    display: inline-block;
    animation: bob 2.2s ease-in-out infinite;
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    background: #ffffffaa;
    padding: 6px;
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px 6px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    color: #a5806b;
    transition: all 0.15s;
    user-select: none;
  }
  .tab.active {
    background: var(--pink);
    color: white;
    box-shadow: 0 3px 8px rgba(232, 84, 144, 0.35);
  }

  .card {
    background: white;
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
    animation: popIn 0.35s ease backwards;
  }

  .place-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: transform 0.15s;
    position: relative;
    overflow: hidden;
  }
  .place-card:active { transform: scale(0.97) rotate(-0.5deg); }
  .place-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.5) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform 0.6s;
  }
  .place-card:hover::before { transform: translateX(100%); }
  .place-info h3 {
    margin: 0 0 3px;
    font-size: 1.1rem;
  }
  .place-info .meta {
    font-size: 0.82rem;
    color: #a5806b;
  }
  .place-arrow {
    font-size: 1.4rem;
    color: var(--pink-deep);
  }
  .top-flavor-chip {
    display: inline-block;
    background: var(--vanilla);
    color: var(--choc);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 0.78rem;
    margin-top: 6px;
    margin-right: 4px;
  }
  .top-flavor-chip .crown { display: inline-block; animation: wiggle 1.6s ease-in-out infinite; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #b08d78;
  }
  .empty-state .big-cone { font-size: 3rem; margin-bottom: 8px; }

  .btn {
    display: inline-block;
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    color: white;
    background: var(--pink);
    box-shadow: 0 4px 10px rgba(232, 84, 144, 0.3);
    width: 100%;
  }
  .btn:active { transform: scale(0.98); }
  .btn.secondary {
    background: var(--mint);
    box-shadow: 0 4px 10px rgba(127, 217, 196, 0.3);
  }
  .btn.ghost {
    background: transparent;
    color: var(--pink-deep);
    box-shadow: none;
    border: 2px solid var(--pink);
    width: auto;
    padding: 8px 14px;
    font-size: 0.85rem;
  }

  .fab {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    right: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--pink), #ff9ac2);
    color: white;
    font-size: 1.9rem;
    border: none;
    box-shadow: 0 6px 18px rgba(232, 84, 144, 0.55);
    cursor: pointer;
    z-index: 20;
    animation: bob 2.4s ease-in-out infinite;
  }
  .fab:active { animation: none; transform: scale(0.9) rotate(15deg); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(90, 56, 37, 0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--cream);
    width: 100%;
    max-width: 640px;
    border-radius: 22px 22px 0 0;
    padding: 22px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h2 {
    margin-top: 0;
    font-size: 1.25rem;
  }
  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 5px;
    color: #8a6a55;
  }
  .field input, .field select {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 2px solid #f0dcc5;
    font-size: 1rem;
    background: white;
    color: var(--choc);
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--pink);
  }

  .cone-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin: 10px 0 4px;
  }
  .cone-btn {
    font-size: 1.7rem;
    background: none;
    border: none;
    cursor: pointer;
    filter: grayscale(100%) opacity(0.35);
    transition: all 0.15s;
  }
  .cone-btn.lit {
    filter: none;
    animation: coneLand 0.3s ease;
  }
  .cone-btn:active { transform: scale(1.3); }
  .rating-label {
    text-align: center;
    font-weight: 700;
    color: var(--pink-deep);
    margin-bottom: 6px;
    font-size: 1.05rem;
  }

  .flavor-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #f5e6d3;
  }
  .flavor-row:last-child { border-bottom: none; }
  .flavor-rank {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--vanilla);
    color: var(--choc);
    font-weight: 700;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 10px;
    flex-shrink: 0;
  }
  .flavor-rank.gold { background: gold; }
  .flavor-name-wrap { display: flex; align-items: center; flex: 1; min-width: 0; }
  .flavor-name {
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .flavor-score {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--pink-deep);
    white-space: nowrap;
    margin-left: 8px;
  }
  .flavor-notes {
    font-size: 0.78rem;
    color: #a5806b;
    margin-top: 2px;
    font-style: italic;
  }

  .back-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .back-btn {
    background: white;
    border: none;
    border-radius: 10px;
    width: 36px;
    height: 36px;
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow: var(--shadow);
    flex-shrink: 0;
  }
  .place-title { font-size: 1.3rem; font-weight: 700; margin: 0; }
  .place-title-sub { font-size: 0.85rem; color: #a5806b; margin-top: 2px; }

  .all-flavor-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 0;
    border-bottom: 1px solid #f5e6d3;
  }
  .all-flavor-row:last-child { border-bottom: none; }
  .all-flavor-name { font-weight: 600; }
  .all-flavor-place { font-size: 0.78rem; color: #a5806b; }
  .sort-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .sort-chip {
    padding: 6px 12px;
    border-radius: 20px;
    background: white;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow);
    color: #a5806b;
  }
  .sort-chip.active {
    background: var(--pink);
    color: white;
  }

  .delete-x {
    background: none;
    border: none;
    color: #d99;
    font-size: 1.1rem;
    cursor: pointer;
    padding: 4px 8px;
  }
</style>
</head>
<body>
<div id="sparkleField"></div>
<div class="app" id="app"></div>
<div id="loadError" style="display:none; text-align:center; padding:16px; color:#c0555a;"></div>

<button class="fab" id="fabBtn">+</button>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// ---------- STATE ----------
const WORKER = 'https://ice-cream-db.danspengeman.workers.dev';
// state.places = [{ id, name, flavors: [{ id, name, rating }] }]
let state = { places: [] };
let view = { screen: 'home', placeId: null, sort: 'rating' };

function uid() {
  return Math.random().toString(36).slice(2, 10);
}

// ---------- SPARKLES ----------
const SPARKLE_CHARS = ['✨', '⭐', '🍦', '🍧', '💖', '🌟'];
function spawnSparkle() {
  const field = document.getElementById('sparkleField');
  const el = document.createElement('span');
  el.className = 'sparkle';
  el.textContent = SPARKLE_CHARS[Math.floor(Math.random() * SPARKLE_CHARS.length)];
  el.style.left = Math.random() * 100 + 'vw';
  const duration = 6 + Math.random() * 6;
  el.style.animationDuration = duration + 's';
  el.style.fontSize = (0.9 + Math.random() * 1.1) + 'rem';
  field.appendChild(el);
  setTimeout(() => el.remove(), duration * 1000 + 200);
}
setInterval(spawnSparkle, 700);
for (let i = 0; i < 6; i++) setTimeout(spawnSparkle, i * 200);

// ---------- CONFETTI BURST (on save) ----------
const CONFETTI_CHARS = ['🎉', '✨', '🍦', '🍨', '💖', '⭐'];
function confettiBurst() {
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('span');
    el.textContent = CONFETTI_CHARS[Math.floor(Math.random() * CONFETTI_CHARS.length)];
    el.style.position = 'fixed';
    el.style.left = '50%';
    el.style.top = '40%';
    el.style.fontSize = (1 + Math.random()) + 'rem';
    el.style.pointerEvents = 'none';
    el.style.zIndex = '999';
    el.style.transition = 'transform 0.9s cubic-bezier(.2,.8,.3,1), opacity 0.9s';
    document.body.appendChild(el);
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 160;
    requestAnimationFrame(() => {
      el.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist - 40}px) rotate(${Math.random() * 360}deg)`;
      el.style.opacity = '0';
    });
    setTimeout(() => el.remove(), 950);
  }
}

function coneRow(rating, size) {
  size = size || '1.05rem';
  let html = '<span style="font-size:' + size + '">';
  for (let i = 1; i <= 10; i++) {
    html += '<span style="opacity:' + (i <= rating ? '1' : '0.22') + '">🍦</span>';
  }
  html += '</span>';
  return html;
}

// ---------- RENDER ----------
function render() {
  const app = document.getElementById('app');
  app.innerHTML = headerHtml() + (view.screen === 'home' ? homeHtml() : view.screen === 'place' ? placeHtml() : allFlavorsHtml());
  attachHomeHandlers();
}

function headerHtml() {
  return `
    <header>
      <h1><span class="cone-emoji">🍦</span> Lillian's Ice Cream Log</h1>
      <div class="sub">Track it. Rate it. Remember your favorites.</div>
    </header>
    <div class="tabs">
      <div class="tab ${view.screen === 'home' ? 'active' : ''}" data-tab="home">Places</div>
      <div class="tab ${view.screen === 'all' ? 'active' : ''}" data-tab="all">All Flavors</div>
    </div>
  `;
}

function topFlavorsForPlace(place) {
  return [...place.flavors].sort((a, b) => b.rating - a.rating);
}

function homeHtml() {
  if (state.places.length === 0) {
    return `
      <div class="empty-state">
        <div class="big-cone">🍧</div>
        <div>No visits logged yet. Tap + to log your first ice cream stop.</div>
      </div>
    `;
  }
  return state.places.map((place, idx) => {
    const sorted = topFlavorsForPlace(place);
    const top = sorted[0];
    const count = place.flavors.length;
    return `
      <div class="card place-card" style="animation-delay:${idx * 0.05}s" data-place-id="${place.id}">
        <div class="place-info">
          <h3>${escapeHtml(place.name)}</h3>
          <div class="meta">${count} flavor${count === 1 ? '' : 's'} logged</div>
          ${top ? `<span class="top-flavor-chip"><span class="crown">👑</span> ${escapeHtml(top.name)} · ${top.rating}/10</span>` : ''}
        </div>
        <div class="place-arrow">›</div>
      </div>
    `;
  }).join('');
}

function placeHtml() {
  const place = state.places.find(p => p.id === view.placeId);
  if (!place) { view.screen = 'home'; return homeHtml(); }
  const sorted = topFlavorsForPlace(place);
  return `
    <div class="back-row">
      <button class="back-btn" data-action="back-home">‹</button>
      <div>
        <p class="place-title">${escapeHtml(place.name)}</p>
        <p class="place-title-sub">Flavors ranked best to worst</p>
      </div>
    </div>
    <div class="card">
      ${sorted.length === 0 ? `<div class="empty-state" style="padding:20px;"><div class="big-cone">🍨</div>No flavors yet for this place.</div>` :
        sorted.map((f, i) => `
          <div class="flavor-row">
            <div class="flavor-name-wrap">
              <div class="flavor-rank ${i === 0 ? 'gold' : ''}">${i + 1}</div>
              <div>
                <div class="flavor-name">${escapeHtml(f.name)}</div>
                ${f.notes ? `<div class="flavor-notes">${escapeHtml(f.notes)}</div>` : ''}
              </div>
            </div>
            <div class="flavor-score">${f.rating}/10 🍦</div>
          </div>
        `).join('')
      }
    </div>
    <button class="btn secondary" data-action="add-flavor-to-place">+ Log a visit here</button>
  `;
}

function allFlavorsHtml() {
  let all = [];
  state.places.forEach(place => {
    place.flavors.forEach(f => all.push({ ...f, placeName: place.name, placeId: place.id }));
  });
  if (view.sort === 'rating') {
    all.sort((a, b) => b.rating - a.rating);
  } else if (view.sort === 'place') {
    all.sort((a, b) => a.placeName.localeCompare(b.placeName) || b.rating - a.rating);
  } else {
    all.sort((a, b) => a.name.localeCompare(b.name));
  }
  return `
    <div class="sort-row">
      <div class="sort-chip ${view.sort === 'rating' ? 'active' : ''}" data-sort="rating">By rating</div>
      <div class="sort-chip ${view.sort === 'place' ? 'active' : ''}" data-sort="place">By place</div>
      <div class="sort-chip ${view.sort === 'name' ? 'active' : ''}" data-sort="name">By name</div>
    </div>
    <div class="card">
      ${all.length === 0 ? `<div class="empty-state" style="padding:20px;"><div class="big-cone">🍨</div>No flavors logged yet.</div>` :
        all.map(f => `
          <div class="all-flavor-row">
            <div>
              <div class="all-flavor-name">${escapeHtml(f.name)}</div>
              <div class="all-flavor-place">${escapeHtml(f.placeName)}</div>
              ${f.notes ? `<div class="flavor-notes">${escapeHtml(f.notes)}</div>` : ''}
            </div>
            <div class="flavor-score">${f.rating}/10 🍦</div>
          </div>
        `).join('')
      }
    </div>
  `;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ---------- EVENT HANDLERS ----------
function attachHomeHandlers() {
  document.querySelectorAll('[data-tab]').forEach(el => {
    el.onclick = () => {
      view.screen = el.dataset.tab === 'home' ? 'home' : 'all';
      render();
    };
  });
  document.querySelectorAll('[data-place-id]').forEach(el => {
    el.onclick = () => {
      view.screen = 'place';
      view.placeId = el.dataset.placeId;
      render();
    };
  });
  document.querySelectorAll('[data-sort]').forEach(el => {
    el.onclick = () => {
      view.sort = el.dataset.sort;
      render();
    };
  });
  const backBtn = document.querySelector('[data-action="back-home"]');
  if (backBtn) backBtn.onclick = () => { view.screen = 'home'; render(); };
  const addFlavorBtn = document.querySelector('[data-action="add-flavor-to-place"]');
  if (addFlavorBtn) addFlavorBtn.onclick = () => openVisitModal(view.placeId);
}

document.getElementById('fabBtn').onclick = () => {
  openVisitModal(view.screen === 'place' ? view.placeId : null);
};

function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
  document.getElementById('modalContent').innerHTML = '';
}

function openVisitModal(preselectPlaceId) {
  document.getElementById('modalOverlay').classList.remove('hidden');
  const modal = document.getElementById('modalContent');
  let rating = 5;
  const placeOptions = state.places.map(p => `<option value="${p.id}" ${p.id === preselectPlaceId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('');
  modal.innerHTML = `
    <h2>🍦 Log an ice cream visit</h2>
    <div class="field">
      <label>Place</label>
      <select id="visitPlaceSelect">
        ${placeOptions}
        <option value="__new__">➕ Add a new place...</option>
      </select>
    </div>
    <div class="field" id="newPlaceField" style="display:${state.places.length === 0 ? 'block' : 'none'};">
      <label>New place name</label>
      <input type="text" id="newPlaceInput" placeholder="e.g. Hoffman's, Nicholas, Cookman Creamery, Day's Ice Cream">
    </div>
    <div class="field">
      <label>Flavor</label>
      <input type="text" id="flavorNameInput" placeholder="e.g. Mint chocolate chip">
    </div>
    <div class="field">
      <label>Rating</label>
      <div class="rating-label" id="ratingLabel">5 / 10</div>
      <div class="cone-picker" id="conePicker"></div>
    </div>
    <div class="field">
      <label>Notes (optional)</label>
      <input type="text" id="notesInput" placeholder="Anything worth remembering">
    </div>
    <button class="btn" id="saveVisitBtn">Save visit</button>
  `;

  const placeSelect = document.getElementById('visitPlaceSelect');
  const newPlaceField = document.getElementById('newPlaceField');
  if (state.places.length === 0) placeSelect.value = '__new__';
  placeSelect.onchange = () => {
    newPlaceField.style.display = placeSelect.value === '__new__' ? 'block' : 'none';
  };

  const picker = document.getElementById('conePicker');
  function drawCones() {
    picker.innerHTML = '';
    for (let i = 1; i <= 10; i++) {
      const b = document.createElement('button');
      b.className = 'cone-btn' + (i <= rating ? ' lit' : '');
      b.textContent = '🍦';
      b.onclick = () => { rating = i; document.getElementById('ratingLabel').textContent = rating + ' / 10'; drawCones(); };
      picker.appendChild(b);
    }
  }
  drawCones();

  if (state.places.length === 0) {
    document.getElementById('newPlaceInput').focus();
  } else {
    document.getElementById('flavorNameInput').focus();
  }

  document.getElementById('saveVisitBtn').onclick = async () => {
    const flavorName = document.getElementById('flavorNameInput').value.trim();
    const notes = document.getElementById('notesInput').value.trim();
    if (!flavorName) return;

    let placeId = placeSelect.value;
    let place;

    if (placeId === '__new__') {
      const newPlaceName = document.getElementById('newPlaceInput').value.trim();
      if (!newPlaceName) return;
      place = { id: uid(), name: newPlaceName, flavors: [] };
      state.places.push(place);
      placeId = place.id;
      try {
        await fetch(WORKER + '/place', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: place.id, name: place.name }),
        });
      } catch (e) {
        console.error('save place failed', e);
      }
    } else {
      place = state.places.find(p => p.id === placeId);
    }

    const newFlavor = { id: uid(), name: flavorName, rating, notes };
    place.flavors.push(newFlavor);
    closeModal();
    view.screen = 'place';
    view.placeId = placeId;
    render();
    confettiBurst();
    try {
      await fetch(WORKER + '/flavor', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: newFlavor.id, place_id: placeId, name: newFlavor.name, rating: newFlavor.rating, notes: newFlavor.notes }),
      });
    } catch (e) {
      console.error('save flavor failed', e);
    }
  };
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});

// ---------- LOAD FROM WORKER ----------
async function loadData() {
  try {
    const res = await fetch(WORKER + '/data');
    if (!res.ok) throw new Error('bad response ' + res.status);
    const data = await res.json();
    state = data;
    render();
  } catch (e) {
    console.error('load failed', e);
    const errEl = document.getElementById('loadError');
    errEl.style.display = 'block';
    errEl.textContent = "Couldn't reach the ice cream database. Check your connection and reload.";
  }
}

(function init() {
  render();
  loadData();
})();
</script>
